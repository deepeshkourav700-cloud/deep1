<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AoneLoot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0f0f;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f0f0f;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      height: 52px;
    }

    .logo { font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .logo span { color: #ff4d00; }

    .tg-btn {
      background: #2AABEE;
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .tg-btn:hover { opacity: 0.85; }
    .tg-btn svg { width: 16px; height: 16px; fill: #fff; flex-shrink: 0; }

    iframe { flex: 1; width: 100%; border: none; display: block; }

    .fallback {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: #aaa; text-align: center; padding: 20px;
    }
    .fallback a {
      background: #ff4d00; color: #fff;
      padding: 12px 28px; border-radius: 10px;
      text-decoration: none; font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Aone<span>Loot</span></div>
    <!-- ✅ Replace with your Telegram link -->
    <a class="tg-btn" href="https://t.me/yourchannel" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.96 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      Join Telegram
    </a>
  </header>

  <iframe
    id="mainFrame"
    src="https://lootcampaign.in?camp=Aone&ref=7CRbRS26"
    title="AoneLoot"
    loading="lazy"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
  ></iframe>

  <div class="fallback" id="fallback">
    <div style="font-size:2rem;">🔗</div>
    <p>Content can't be shown in frame.<br>Open directly below.</p>
    <a href="https://lootcampaign.in?camp=Aone&ref=7CRbRS26" target="_blank" rel="noopener">Open Campaign →</a>
  </div>

  <script>
    const iframe = document.getElementById('mainFrame');
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc || doc.body.innerHTML === '') showFallback();
      } catch(e) {}
    });
    function showFallback() {
      iframe.style.display = 'none';
      document.getElementById('fallback').style.display = 'flex';
    }
  </script>

</body>
</html>
---

**How to use it:**

1. Copy the code above
2. Paste it into a file called `index.html`
3. Find this line and replace with your real Telegram link:
```
   href="https://t.me/yourchannel"
